        async function sendResultToTelegram({ studentName, score, total, percentage, answers, questionsData }) {
            try {

                const res = await fetch("/api/send-result", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        studentName,
                        score,
                        total,
                        percentage,
                        answers,
                        questionsData
                    })
                });

                const data = await res.json();

    rationale: "الفكرة الأساسية للدرس هي أن الذكاء الاصطناعي مجال واسع يحتوي على تقنيات تصبح أكثر تخصصًا بشكل تدريجي."
  },
  {
    id: 18,
    question: "تمتلك إحدى الشركات مجموعة كبيرة من بيانات التدريب وتريد أن يتعرف نظامها على أنماط معقدة في هذه البيانات. ما التقنية التي ستكون مناسبة بشكل خاص؟",
    options: [
      "التعلم العميق",
      "إدخال البيانات يدويًا",
      "قاعدة ثابتة بدون تعلم",
      "محرر نصوص بسيط"
    ],
    correctIndex: 0,
    rationale: "يستخدم التعلم العميق الشبكات العصبية وكميات كبيرة من البيانات لتعلم الأنماط المعقدة."
  },
  {
    id: 19,
    question: "يقول أحد الطلاب: \"إذا كانت الإجابة التي أنشأها الذكاء الاصطناعي تبدو طبيعية، فلا بد أن تكون صحيحة.\" ما الاستنتاج من الدرس الذي يتحدى هذه الفكرة؟",
    options: [
      "يمكن للذكاء الاصطناعي التوليدي إنتاج معلومات مقنعة لكنها غير صحيحة من الناحية الواقعية",
      "لا يستطيع الذكاء الاصطناعي إنشاء النصوص أبدًا",
      "التعلم العميق لا يستخدم البيانات",
      "تعلم الآلة يعمل فقط مع الصور"
    ],
    correctIndex: 0,
    rationale: "يحذر الدرس تحديدًا من ظاهرة الهلوسة، حيث قد يبدو المحتوى الذي تم إنشاؤه صحيحًا ولكنه يحتوي في الحقيقة على معلومات خاطئة."
  },
  {
    id: 20,
    question: "يريد أحد المزارعين استخدام الذكاء الاصطناعي للتعرف على المحاصيل السليمة والمصابة بالأمراض من خلال الصور. وقد تعلم النظام من العديد من صور المحاصيل. ما الذي يمكن أن يتسبب في إصدار النظام حكمًا خاطئًا؟",
    options: [
      "قد تحتوي الصور الجديدة على أنماط نادرًا ما كانت موجودة في بيانات التدريب",
      "التعلم العميق لا يستخدم الصور",
      "الذكاء الاصطناعي يصدر دائمًا أحكامًا صحيحة",
      "الذكاء الاصطناعي التوليدي لا يستطيع معالجة أي بيانات"
    ],
    correctIndex: 0,
    rationale: "تتعلم أنظمة الذكاء الاصطناعي من البيانات، ولذلك قد تواجه صعوبة عندما تقابل مواقف أو أنماطًا نادرًا ما كانت موجودة في البيانات التي تعلمت منها."
  }
];


        function App() {
            // New State for Game Flow
            const [hasStarted, setHasStarted] = useState(false);
            const [studentName, setStudentName] = useState("");
            const [nameError, setNameError] = useState(false);
            const resultSentRef = useRef(false);

            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [flagged, setFlagged] = useState({});
            const [timeLeft, setTimeLeft] = useState(40 * 60);
            const [isFinished, setIsFinished] = useState(false);

            // Timer Logic - Starts only if hasStarted is true
            useEffect(() => {
                if (!hasStarted || isFinished) return;
                
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            finishExam();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [hasStarted, isFinished]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const handleAnswerSelect = (optionIndex) => {
                if (isFinished) return;
                setAnswers(prev => ({...prev, [currentQuestionIndex]: optionIndex}));
            };

            const toggleFlag = () => {
                if (isFinished) return;
                setFlagged(prev => ({
                    ...prev, 
                    [currentQuestionIndex]: !prev[currentQuestionIndex]
                }));
            };

            const finishExam = () => {
                setIsFinished(true);

                // نبعت النتيجة في كل محاولة (مش مربوطة بالجهاز/localStorage خالص).
                // resultSentRef هنا بس بيمنع نداء مزدوج لنفس المحاولة (مثلاً لو انتهاء الوقت
                // وزرار "إنهاء الامتحان" حصلوا في نفس اللحظة بالظبط).
                if (resultSentRef.current) {
                    console.log("تم تخطي الإرسال: النتيجة اتبعتت بالفعل لنفس المحاولة الحالية.");
                    return;
                }
                resultSentRef.current = true;

                let score = 0;
                questionsData.forEach((q, idx) => {
                    if (answers[idx] === q.correctIndex) score++;
                });
                const percentage = (score / questionsData.length) * 100;

                sendResultToTelegram({
                    studentName,
                    score,
                    total: questionsData.length,
                    percentage,
                    answers,
                    questionsData
                });
            };

            const scoreData = useMemo(() => {
                let score = 0;
                questionsData.forEach((q, idx) => {
                    if (answers[idx] === q.correctIndex) score++;
                });
                const percentage = (score / questionsData.length) * 100;
                return { score, percentage };
            }, [answers]);

            // --- 1. WELCOME SCREEN ---
            if (!hasStarted) {
                return (
                    <div className="flex flex-col items-center justify-center h-full bg-gray-50 relative animate-fade-in p-4 sm:p-6 overflow-y-auto">
                        {/* Instructor Name - Right Side */}
                        <div className="welcome-instructor absolute top-6 right-6 md:top-12 md:right-16 text-right border-r-4 border-[#0056b3] pr-4">
                            <p className="text-gray-500 text-xs sm:text-sm font-semibold mb-1">إعداد وإشراف</p>
                            <h2 className="text-xl sm:text-3xl md:text-4xl font-black text-gray-800">م/ أحمد عبدالغني</h2>
                        </div>

                        {/* Center Content */}
                        <div className="text-center max-w-lg w-full mt-24 md:mt-0">
                            <div className="mb-8 md:mb-12">
                                <div className="inline-block p-3 sm:p-4 rounded-full bg-blue-50 mb-4 sm:mb-6 border border-blue-100">
                                    <i className="fa-solid fa-laptop-code text-3xl sm:text-5xl text-[#0056b3]"></i>
                                </div>
                                <h1 className="exam-title tracking-tight">
                                    اختبار الدرس التاني
                                </h1>
                                <p className="exam-sub font-medium">
                                  اختبار الوحدة الأولي
                                </p>
                            </div>

                            <div className="space-y-5 sm:space-y-6">
                                <div className="flex justify-center gap-6 sm:gap-8 text-gray-600 mb-2 sm:mb-4">
                                    <div className="flex flex-col items-center">
                                        <span className="font-bold text-base sm:text-lg text-gray-800">{questionsData.length}</span>
                                        <span className="text-xs sm:text-sm">سؤال</span>
                                    </div>
                                    <div className="w-px bg-gray-300"></div>
                                    <div className="flex flex-col items-center">
                                        <span className="font-bold text-base sm:text-lg text-gray-800">40</span>
                                        <span className="text-xs sm:text-sm">دقيقة</span>
                                    </div>
                                </div>

                                <div className="text-right max-w-xs mx-auto px-2">
                                    <label className="block text-gray-600 font-bold mb-2 text-sm">اكتب اسمك قبل البدء</label>
                                    <input
                                        type="text"
                                        value={studentName}
                                        onChange={(e) => { setStudentName(e.target.value); if (nameError) setNameError(false); }}
                                        placeholder="الاسم بالكامل"
                                        className={`w-full p-3 rounded-lg border-2 text-base sm:text-lg focus:outline-none transition ${nameError ? 'border-red-400' : 'border-gray-200 focus:border-[#0056b3]'}`}
                                    />
                                    {nameError && (
                                        <p className="text-red-500 text-sm mt-1">من فضلك اكتب اسمك أولاً</p>
                                    )}
                                </div>

                                <button 
                                    onClick={() => {
                                        if (!studentName.trim()) {
                                            setNameError(true);
                                            return;
                                        }
                                        setHasStarted(true);
                                    }}
                                    className="start-cta btn-pulse bg-[#0056b3] text-white text-lg sm:text-2xl font-bold py-3 sm:py-4 px-10 sm:px-16 rounded-full hover:bg-blue-700 transition transform hover:scale-105 shadow-xl w-full md:w-auto"
                                >
                                    ابــدأ الآن
                                </button>
                                <p className="text-gray-400 text-xs sm:text-sm mt-4">
                                    بالضغط على "ابدأ"، سيبدأ العداد التنازلي مباشرة.
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- 2. RESULT SCREEN ---
            if (isFinished) {
                let message = "";
                let colorClass = "";
                if (scoreData.percentage >= 80) {
                    message = "امتياز";
                    colorClass = "text-green-600";
                } else if (scoreData.percentage >= 60) {
                    message = "جيد جدا";
                    colorClass = "text-blue-600";
                } else {
                    message = "حاول مرة اخري";
                    colorClass = "text-red-600";
                }

                return (
                    <div className="flex flex-col items-center justify-center h-full bg-gray-50 p-3 sm:p-6 animate-fade-in overflow-y-auto">
                        <div className="bg-white p-4 sm:p-8 rounded-lg shadow-xl text-center max-w-2xl w-full border-t-8 border-[#0056b3] my-4 sm:my-6">
                            <h1 className="text-2xl sm:text-4xl font-bold mb-1 text-[#0056b3]">نتيجة الاختبار</h1>
                            {studentName && (
                                <p className="text-gray-500 font-semibold mb-4 break-words">{studentName}</p>
                            )}
                            <div className="text-4xl sm:text-6xl font-bold mb-6 text-gray-800">
                                {scoreData.score} / {questionsData.length}
                            </div>
                            <div className="w-full bg-gray-200 rounded-full h-4 mb-6">
                                <div 
                                    className="bg-[#0056b3] h-4 rounded-full transition-all duration-1000" 
                                    style={{width: `${scoreData.percentage}%`}}
                                ></div>
                            </div>
                            <p className={`text-lg sm:text-xl font-semibold mb-8 ${colorClass}`}>
                                {message}
                            </p>
                            
                            <div className="text-right border-t pt-6 max-h-96 overflow-y-auto">
                                <h3 className="font-bold text-gray-700 mb-4">مراجعة الإجابات:</h3>
                                {questionsData.map((q, idx) => (
                                    <div key={idx} className="mb-4 p-3 bg-gray-50 rounded border">
                                        <div className="font-bold text-sm text-gray-500 mb-1">سؤال {idx + 1}</div>
                                        <div className="font-semibold text-gray-800 mb-1">{q.question}</div>
                                        <div className="flex items-center gap-2 mt-1 flex-wrap">
                                            <span className={answers[idx] === q.correctIndex ? "text-green-600 font-bold" : "text-red-600 font-bold"}>
                                                {answers[idx] === q.correctIndex ? "إجابة صحيحة" : (answers[idx] === undefined ? "لم تتم الإجابة" : "إجابة خاطئة")}
                                            </span>
                                            {answers[idx] !== q.correctIndex && (
                                                <span className="text-gray-500 text-sm">
                                                    (الصحيح: {q.options[q.correctIndex]})
                                                </span>
                                            )}
                                        </div>
                                        <p className="text-xs text-gray-600 mt-1">{q.rationale}</p>
                                    </div>
                                ))}
                            </div>

                            <button 
                                onClick={() => window.location.reload()}
                                className="mt-6 px-6 sm:px-8 py-3 bg-[#0056b3] text-white rounded hover:bg-blue-700 transition font-bold w-full sm:w-auto"
                            >
                                العودة للصفحة الرئيسية
                            </button>
                        </div>
                    </div>
                );
            }

            const currentQuestion = questionsData[currentQuestionIndex];

            // --- 3. EXAM INTERFACE ---
            return (
                <div className="flex flex-col h-full relative animate-fade-in overflow-hidden">
                    <header className="flex justify-between items-center p-3 sm:p-4 shadow-sm border-b bg-white z-10 h-14 sm:h-16 flex-shrink-0">
                        <div className="flex items-center gap-2 sm:gap-4 min-w-0">
                            <div className="bg-[#0056b3] text-white font-bold px-2 sm:px-3 py-1 rounded text-xs sm:text-sm whitespace-nowrap">
                              تانية بكالوريا - اختبار الوحدة الأولي - الدرس التاني
                            </div>
                            <div className="font-bold text-gray-700 hidden sm:block truncate">م/ أحمد عبدالغني</div>
                        </div>

                        <div className={`font-mono text-lg sm:text-xl font-bold w-20 sm:w-24 text-center flex-shrink-0 ${timeLeft < 300 ? 'text-red-600 animate-pulse' : 'text-gray-700'}`}>
                            {formatTime(timeLeft)}
                        </div>
                    </header>

                    {/* Question navigator dots - visible on all screen sizes, scrollable on mobile */}
                    <div className="mobile-qnav flex-shrink-0">
                        {questionsData.map((_, idx) => (
                            <button
                                key={idx}
                                onClick={() => setCurrentQuestionIndex(idx)}
                                className={`w-8 h-8 rounded flex items-center justify-center text-sm font-bold transition-all flex-shrink-0
                                    ${currentQuestionIndex === idx ? 'ring-2 ring-[#0056b3] ring-offset-1' : ''}
                                    ${flagged[idx] ? 'bg-orange-100 text-orange-600 border border-orange-400' : 
                                      answers[idx] !== undefined ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-gray-100 text-gray-500'}
                                `}
                            >
                                {idx + 1}
                            </button>
                        ))}
                    </div>

                    <main className="flex-1 flex flex-col md:flex-row overflow-hidden bg-gray-50">
                        <div className="flex-1 overflow-y-auto p-3 sm:p-4 md:p-8 pb-24">
                            <div className="max-w-4xl mx-auto bg-white rounded-lg shadow-sm border p-4 sm:p-6 min-h-[300px] sm:min-h-[400px]">
                                <div className="flex justify-between items-start mb-4 sm:mb-6 gap-2">
                                    <span className="text-gray-500 font-bold text-sm sm:text-lg">سؤال {currentQuestionIndex + 1} من {questionsData.length}</span>
                                    <button 
                                        onClick={toggleFlag}
                                        className={`flex items-center gap-1 sm:gap-2 px-2 sm:px-3 py-1 rounded border transition text-xs sm:text-sm flex-shrink-0 ${flagged[currentQuestionIndex] ? 'bg-orange-50 border-orange-400 text-orange-600' : 'text-gray-400 border-gray-200 hover:bg-gray-50'}`}
                                    >
                                        <i className={`fa-solid fa-flag ${flagged[currentQuestionIndex] ? 'text-orange-500' : ''}`}></i>
                                        <span className="font-bold hidden xs:inline">مراجعة لاحقاً</span>
                                    </button>
                                </div>

                                <h2 className="text-base sm:text-xl font-bold text-gray-800 mb-5 sm:mb-8 border-r-4 border-[#0056b3] pr-3 sm:pr-4 whitespace-pre-line">
                                    {currentQuestion.question}
                                </h2>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">
                                    {currentQuestion.options.map((opt, idx) => (
                                        <label 
                                            key={idx}
                                            className={`
                                                relative flex items-center p-3 sm:p-4 rounded-lg border-2 cursor-pointer transition-all duration-200 group
                                                ${answers[currentQuestionIndex] === idx 
                                                    ? 'border-[#0056b3] bg-blue-50 shadow-md' 
                                                    : 'border-gray-200 hover:border-gray-300 bg-white'}
                                            `}
                                        >
                                            <input 
                                                type="radio" 
                                                name={`q-${currentQuestionIndex}`} 
                                                className="hidden" 
                                                checked={answers[currentQuestionIndex] === idx}
                                                onChange={() => handleAnswerSelect(idx)}
                                            />
                                            <div className={`
                                                w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 ml-3 sm:ml-4 flex items-center justify-center flex-shrink-0
                                                ${answers[currentQuestionIndex] === idx ? 'border-[#0056b3]' : 'border-gray-300 group-hover:border-gray-400'}
                                            `}>
                                                {answers[currentQuestionIndex] === idx && (
                                                    <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-[#0056b3]"></div>
                                                )}
                                            </div>
                                            <span className="text-sm sm:text-lg font-medium text-gray-700 break-words">{opt}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="exam-footer bg-white px-3 sm:px-4 pt-3 sm:pt-4 border-t shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-20 flex justify-between items-center min-h-[64px] sm:min-h-[80px] flex-shrink-0 gap-2">
                        <button 
                            onClick={() => setCurrentQuestionIndex(prev => Math.max(0, prev - 1))}
                            disabled={currentQuestionIndex === 0}
                            className={`px-3 sm:px-6 py-2 border-2 font-bold rounded transition text-sm sm:text-base flex-shrink-0 ${currentQuestionIndex === 0 ? 'border-gray-200 text-gray-400 cursor-not-allowed' : 'border-gray-300 text-gray-600 hover:bg-gray-100'}`}
                        >
                            السابق
                        </button>

                        <div className="hidden md:block w-1/3 bg-gray-200 rounded-full h-2">
                             <div 
                                className="bg-[#4CAF50] h-2 rounded-full transition-all duration-300"
                                style={{width: `${(Object.keys(answers).length / questionsData.length) * 100}%`}}
                            ></div>
                        </div>

                        {currentQuestionIndex === questionsData.length - 1 ? (
                            <button 
                                onClick={finishExam}
                                className="px-4 sm:px-8 py-2 bg-[#0056b3] text-white font-bold rounded hover:bg-blue-700 shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5 text-sm sm:text-base flex-shrink-0"
                            >
                                إنهاء الامتحان
                            </button>
                        ) : (
                            <button 
                                onClick={() => setCurrentQuestionIndex(prev => Math.min(questionsData.length - 1, prev + 1))}
                                className="px-4 sm:px-8 py-2 bg-[#0056b3] text-white font-bold rounded hover:bg-blue-700 shadow hover:shadow-md transition text-sm sm:text-base flex-shrink-0"
                            >
                                التالي
                            </button>
                        )}
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
